<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>詳細配送手配</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Yu Gothic", "Meiryo", sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .spacer {
      flex: 1;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .value {
      font-size: 14px;
      font-weight: 700;
    }

    .task-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }

    .cargo-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 0;
    }

    .cargo-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cargo-item input {
      width: 16px;
      height: 16px;
    }

    .btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    .request-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    @media (max-width: 900px) {
      .summary-grid,
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="header">
      <h1>詳細配送手配</h1>
      <div class="spacer"></div>
      <button class="btn" onclick="window.close()">閉じる</button>
    </div>

    <div class="card">
      <div class="summary-grid">
        <div>
          <div class="label">JOB NO</div>
          <div class="value" id="job-no">-</div>
        </div>

        <div>
          <div class="label">Shipment ID</div>
          <div class="value" id="shipment-id">-</div>
        </div>

        <div>
          <div class="label">新規派生番号</div>
          <div class="value" id="next-suffix">-</div>
        </div>

        <div>
          <div class="label">新規依頼番号</div>
          <div class="value" id="next-request-no">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="task-title">既存の詳細配送依頼</div>
      <div id="request-list">
        <div style="color:#94a3b8;">読み込み中...</div>
      </div>
    </div>

    <div id="task-container"></div>

    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn" onclick="addTask()">Task追加</button>
      <button class="btn btn-primary" onclick="saveArrangement()">保存</button>
    </div>

  </div>

  <script>
    let pageData = null;
    let taskSeq = 0;
    let editingRequestId = null;

    const params =
      new URLSearchParams(location.search);

    const shipmentId =
      params.get('shipment_id') || '';

    if (!shipmentId) {
      alert('shipment_id がありません');
    }

    async function apiFetch(url, options = {}) {
      const res = await fetch(url, options);

      const json = await res.json();

      if (!res.ok || json.ok === false) {
        throw new Error(
          json.error ||
          'API Error'
        );
      }

      return json;
    }

    async function loadArrangement() {
      try {
        const res =
          await apiFetch(
            '/api/admin/transport-arrangement/' +
            encodeURIComponent(shipmentId)
          );

        pageData = res;

        document.getElementById('job-no').textContent =
          res.shipment?.job_no || '-';

        document.getElementById('shipment-id').textContent =
          res.shipment?.shipment_id || '-';

        document.getElementById('next-suffix').textContent =
          res.next_suffix || '-';

        document.getElementById('next-request-no').textContent =
          res.next_request_no || '-';

        renderRequestList(
          res.requests || []
        );

        addTask();

      } catch (err) {
        console.error(err);
        alert(err.message || '読み込みに失敗しました');
      }
    }

    function renderRequestList(requests) {
  const container =
    document.getElementById('request-list');

  if (!requests.length) {
    container.innerHTML =
      '<div style="color:#94a3b8;">既存依頼はありません</div>';
    return;
  }

  container.innerHTML =
    requests.map(function(r) {
      return (
        '<div class="request-row">' +

          '<strong>' +
            escapeHtml(r.request_no || '-') +
          '</strong>' +

          '<span>' +
            escapeHtml(r.status || '') +
          '</span>' +

          '<button class="btn" ' +
            'onclick="editRequest(\'' +
              escapeJs(r.transport_request_id || '') +
            '\')">' +
            '編集' +
          '</button>' +

          '<button class="btn" ' +
            'onclick="openDeliveryRequest(\'' +
              escapeJs(r.transport_request_id || '') +
            '\')">' +
            '依頼書を開く' +
          '</button>' +

        '</div>'
      );
    }).join('');
}

    function addTask() {
      taskSeq += 1;

      const container =
        document.getElementById('task-container');

      const div =
        document.createElement('div');

      div.className = 'card transport-task';
      div.dataset.taskIndex = String(taskSeq);

      div.innerHTML =
        buildTaskHtml(taskSeq);

      container.appendChild(div);
    }

    function buildTaskHtml(index, task = null) {

  task = task || {};

  const selectedTrucker =
    String(task.trucker_code || '');

  const selectedPickupId =
    String(task.pickup_place_id || '');

  const selectedPickupName =
    String(task.pickup_place_name || '');

  const selectedDeliveryName =
    String(task.delivery_place_name || '');


  // 引取先の復元値
  let selectedPickupSource = '';

  if (selectedPickupId) {

    selectedPickupSource =
      'INBOUND:' + selectedPickupId;

  } else if (selectedPickupName) {

    const matchedDest =
      (pageData?.dests || [])
        .find(d =>
          String(d.dest_name || '') ===
          selectedPickupName
        );

    if (matchedDest) {
      selectedPickupSource =
        'DEST:' + matchedDest.dest_id;
    }
  }


  // 配送先の復元値
  const selectedDeliveryDest =
    (pageData?.dests || [])
      .find(d =>
        String(d.dest_name || '') ===
        selectedDeliveryName
      );

  const selectedDeliveryDestId =
    selectedDeliveryDest?.dest_id || '';


  // 選択済みコンテナ
  const selectedContainerNos =
    new Set(
      (
        Array.isArray(task.cargo_refs)
          ? task.cargo_refs
          : []
      )
        .filter(ref =>
          String(ref?.type || '').toUpperCase() ===
          'CONTAINER'
        )
        .map(ref =>
          String(ref.id || '')
        )
    );


  // =====================================================
  // 配送業者 options
  // =====================================================
  const truckerOptions =
    (pageData?.truckers || [])
      .map(t => {

        const code =
          String(t.partner_code || '');

        const selected =
          code === selectedTrucker
            ? ' selected'
            : '';

        return (
          '<option value="' +
            escapeHtml(code) +
            '"' +
            selected +
          '>' +
            escapeHtml(
              t.partner_name ||
              t.partner_code ||
              ''
            ) +
          '</option>'
        );
      })
      .join('');

      const pickupOptions =
  [
    '<optgroup label="搬入・引取場所">',

    ...(pageData?.pickup_places || []).map(p =>
      '<option value="INBOUND:' +
        escapeHtml(p.place_id || '') +
      '">' +
        escapeHtml(
          p.place_name ||
          p.place_id ||
          ''
        ) +
      '</option>'
    ),

    '</optgroup>',

    '<optgroup label="配送先マスタ">',

    ...(pageData?.dests || []).map(d =>
      '<option value="DEST:' +
        escapeHtml(d.dest_id || '') +
      '">' +
        escapeHtml(
          d.dest_name ||
          d.dest_id ||
          ''
        ) +
      '</option>'
    ),

    '</optgroup>'
  ].join('');

      const deliveryOptions =
  (pageData?.dests || [])
    .map(dest =>
      '<option value="' +
        escapeHtml(dest.dest_id || '') +
      '">' +
        escapeHtml(
          dest.dest_name ||
          dest.dest_id ||
          ''
        ) +
      '</option>'
    )
    .join('');

      const cargoHtml =
  (pageData?.containers || [])
    .map(c => {
      const containerNo =
        String(c.container_no || '');

      const checked =
        selectedContainerNos.has(containerNo)
          ? ' checked'
          : '';

      return (
        '<label class="cargo-item">' +
          '<input type="checkbox" ' +
            'data-container-no="' +
              escapeHtml(containerNo) +
            '"' +
            checked +
          '>' +
          '<span>' +
            escapeHtml(
              [
                c.container_no,
                c.container_type
              ]
                .filter(Boolean)
                .join(' / ')
            ) +
          '</span>' +
        '</label>'
      );
    })
    .join('');

      return (
        '<div class="task-title">' +
          'Task ' + index +
        '</div>' +

        '<div class="grid-3">' +

          '<div class="input-group">' +
            '<label class="label">配送業者</label>' +
            '<select data-field="trucker_code">' +
              '<option value="">選択してください</option>' +
              truckerOptions +
            '</select>' +
          '</div>' +

          '<div class="input-group">' +
            '<label class="label">引取場所</label>' +
            '<select data-field="pickup_place_id">' +
              '<option value="">選択してください</option>' +
              pickupOptions +
            '</select>' +
          '</div>' +

          '<div class="input-group">' +
            '<label class="label">配送先</label>' +
            '<select data-field="delivery_dest_id">' +
              '<option value="">選択してください</option>' +
              deliveryOptions +
            '</select>' +
          '</div>' +

        '</div>' +

        '<div class="grid-3">' +

  '<div class="input-group">' +
    '<label class="label">引取日</label>' +
    '<input type="date" ' +
      'data-field="pickup_date" ' +
      'value="' + escapeHtml(task.pickup_date || '') + '">' +
  '</div>' +

  '<div class="input-group">' +
    '<label class="label">引取時間</label>' +
    '<input type="time" ' +
      'data-field="pickup_time" ' +
      'value="' + escapeHtml(task.pickup_time || '') + '">' +
  '</div>' +

  '<div class="input-group">' +
    '<label class="label">車種</label>' +
    '<input type="text" ' +
      'data-field="vehicle_type" ' +
      'value="' + escapeHtml(task.vehicle_type || '') + '">' +
  '</div>' +

'</div>' +

        '<div class="input-group">' +
          '<label class="label">対象コンテナ</label>' +
          '<div class="cargo-list">' +
            cargoHtml +
          '</div>' +
        '</div>' +

        '<div class="input-group">' +
          '<label class="label">備考</label>' +
          '<textarea rows="3" data-field="remarks"></textarea>' +
        '</div>'
      );
    }

    function escapeHtml(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeJs(v) {
      return String(v ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");
    }

    function editRequest(requestId) {
  if (!pageData) return;

  const request =
    (pageData.requests || [])
      .find(r =>
        String(r.transport_request_id) ===
        String(requestId)
      );

  if (!request) {
    return alert('対象の配送依頼が見つかりません');
  }

  const tasks =
    (pageData.transport_tasks || [])
      .filter(task =>
        String(task.transport_request_id) ===
        String(requestId)
      )
      .sort((a, b) =>
        Number(a.sort_no || 0) -
        Number(b.sort_no || 0)
      );

  editingRequestId =
    request.transport_request_id;

  // -----------------------------------------------------
  // 上部表示を編集中Requestへ変更
  // -----------------------------------------------------
  document.getElementById('next-suffix').textContent =
    request.request_suffix || '-';

  document.getElementById('next-request-no').textContent =
    request.request_no || '-';

  // -----------------------------------------------------
  // Task画面をクリア
  // -----------------------------------------------------
  const taskContainer =
    document.getElementById('task-container');

  taskContainer.innerHTML = '';

  taskSeq = 0;

  // -----------------------------------------------------
  // 保存済みTaskを復元
  // -----------------------------------------------------
  if (!tasks.length) {
    addTask();
    return;
  }

  tasks.forEach(task => {
    addTask(task);
  });

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

    async function openDeliveryRequest(
  transportRequestId
) {
  try {
    if (!transportRequestId) {
      return alert(
        'transport_request_id がありません'
      );
    }

    if (!pageData?.shipment?.shipment_id) {
      return alert(
        'shipment_id がありません'
      );
    }

    const result =
      await apiFetch(
        '/api/doc-token',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              shipment_id:
                pageData.shipment.shipment_id,

              doc_type:
                'delivery',

              transport_request_id:
                transportRequestId
            })
        }
      );

    if (!result.url) {
      return alert(
        '配送依頼書URLを取得できません'
      );
    }

    window.open(
      result.url,
      '_blank'
    );

  } catch (err) {
    console.error(
      'openDeliveryRequest error:',
      err
    );

    alert(
      err.message ||
      '配送依頼書を開けませんでした'
    );
  }
}

    async function saveArrangement() {
  try {
    if (!pageData) {
      return alert('画面データが読み込まれていません');
    }

    const taskCards =
      document.querySelectorAll('.transport-task');

    if (!taskCards.length) {
      return alert('Taskを1件以上作成してください');
    }

    const tasks = [];

    taskCards.forEach(function(card, index) {

      const getValue = function(field) {
        const el =
          card.querySelector(
            '[data-field="' + field + '"]'
          );

        return el
          ? String(el.value || '').trim()
          : '';
      };

      // ===================================================
      // 対象コンテナ
      // ===================================================
      const cargoRefs = [];

      card
        .querySelectorAll(
          'input[data-container-no]:checked'
        )
        .forEach(function(el) {

          const containerNo =
            String(
              el.dataset.containerNo || ''
            ).trim();

          if (!containerNo) return;

          cargoRefs.push({
            type: 'CONTAINER',
            id: containerNo
          });
        });

      // ===================================================
      // 配送先
      // ===================================================
      const deliveryDestId =
  getValue('delivery_dest_id');

const deliveryDest =
  (pageData.dests || [])
    .find(function(dest) {
      return String(dest.dest_id) ===
        String(deliveryDestId);
    });

      const deliveryLine =
        (pageData.delivery_lines || [])
          .find(function(line) {
            return String(line.line_id) ===
              String(deliveryLineId);
          });

      // ===================================================
// 引取場所
// INBOUND = inbound_place_master
// DEST    = dests
// ===================================================
const pickupSource =
  getValue('pickup_place_id');

let pickupPlaceId = null;
let pickupPlaceName = null;
let pickupAddress = null;


// inbound_place_master から選択した場合
if (pickupSource.startsWith('INBOUND:')) {

  pickupPlaceId =
    pickupSource.replace('INBOUND:', '');

  const pickupPlace =
    (pageData.pickup_places || [])
      .find(function(place) {
        return String(place.place_id) ===
          String(pickupPlaceId);
      });

  pickupPlaceName =
    pickupPlace?.place_name || null;

  pickupAddress =
    pickupPlace?.display_address || null;


// dests から選択した場合
} else if (pickupSource.startsWith('DEST:')) {

  const destId =
    pickupSource.replace('DEST:', '');

  const pickupDest =
    (pageData.dests || [])
      .find(function(dest) {
        return String(dest.dest_id) ===
          String(destId);
      });

  // inbound_place_master のIDではないのでnull
  pickupPlaceId = null;

  pickupPlaceName =
    pickupDest?.dest_name || null;

  pickupAddress =
    pickupDest?.display_address || null;
}

      tasks.push({
        sort_no: index + 1,

        trucker_code:
          getValue('trucker_code') || null,

        pickup_place_id:
           pickupPlaceId,

        pickup_place_name:
          pickupPlaceName,

        pickup_address:
          pickupAddress,

        pickup_date:
          getValue('pickup_date') || null,

        pickup_time:
          getValue('pickup_time') || null,

        delivery_place_name:
          deliveryLine?.delivery_dest_name || null,

        delivery_address:
          deliveryLine?.delivery_address || null,

        delivery_date:
          deliveryLine?.delivery_fixed ||
          deliveryLine?.delivery_plan_date ||
          deliveryLine?.delivery_request_date ||
          null,

        delivery_time:
          deliveryLine?.delivery_fixed_time ||
          deliveryLine?.delivery_plan_time ||
          deliveryLine?.delivery_request_time ||
          null,

        vehicle_type:
          getValue('vehicle_type') || null,

        cargo_type:
          cargoRefs.length === 1
            ? cargoRefs[0].type
            : null,

        cargo_ref:
          cargoRefs.length === 1
            ? cargoRefs[0].id
            : null,

        cargo_refs:
          cargoRefs,

        remarks:
          getValue('remarks') || null
      });
    });

    // =====================================================
    // 最低限Validation
    // =====================================================
    for (let i = 0; i < tasks.length; i++) {

      const task = tasks[i];

      if (!task.trucker_code) {
        return alert(
          'Task ' + (i + 1) +
          ' の配送業者を選択してください'
        );
      }

      if (!task.cargo_refs.length) {
        return alert(
          'Task ' + (i + 1) +
          ' の対象貨物または配送先を選択してください'
        );
      }
    }

    // =====================================================
    // POST
    // =====================================================
    const editingRequest =
  editingRequestId
    ? (pageData.requests || [])
        .find(r =>
          String(r.transport_request_id) ===
          String(editingRequestId)
        )
    : null;

const payload = {
  shipment_id:
    pageData.shipment.shipment_id,

  transport_request_id:
    editingRequestId || null,

  request_no:
    editingRequest?.request_no ||
    pageData.next_request_no,

  request_suffix:
    editingRequest?.request_suffix ||
    pageData.next_suffix,

  request_type:
    'ADVANCED',

  status:
    editingRequest?.status ||
    'DRAFT',

  remarks:
    editingRequest?.remarks ||
    '',

  tasks
};

    console.log(
      '[TRANSPORT SAVE PAYLOAD]',
      payload
    );

    const result =
      await apiFetch(
        '/api/admin/transport-arrangement',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(payload)
        }
      );

    console.log(
      '[TRANSPORT SAVE RESULT]',
      result
    );

    alert(
      (result.request_no ||
        pageData.next_request_no) +
      ' を保存しました'
    );

    editingRequestId = null;
    // =====================================================
    // 保存後再読込
    // → B保存後なら次の番号Cへ更新される
    // =====================================================
    document.getElementById(
      'task-container'
    ).innerHTML = '';

    taskSeq = 0;

    await loadArrangement();

  } catch (err) {
    console.error(
      'saveArrangement error:',
      err
    );

    alert(
      err.message ||
      '詳細配送手配の保存に失敗しました'
    );
  }
}

    loadArrangement();
  </script>
</body>
</html>
